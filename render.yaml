services:
  - type: web
    name: telegram-hacking
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: OWNER_EMAIL
        sync: false
    # Optional: Increase timeout for free tier spin-up
    # Render free tier spins down after 15 min inactivity
    # First request after spin-down can take 30-60s